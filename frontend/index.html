<!doctype html>
<html lang="en" dir="ltr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Padi NMS</title>
    <script>
      try {
        var t = localStorage.getItem("padi-theme");
        if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", t);
        var l = localStorage.getItem("padi-lang");
        if (!l) l = (navigator.language || "").toLowerCase().indexOf("fa") === 0 ? "fa" : "en";
        document.documentElement.setAttribute("lang", l);
        document.documentElement.setAttribute("dir", l === "fa" ? "rtl" : "ltr");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
